<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>伴柠 · AI 陪伴流水线监听</title>
  <link rel="stylesheet" href="frontend/css/companion-logs.css?v=1">
</head>
<body>
<main>
  <nav><a href="/vision-test.html">单帧感知测试</a><a class="active" href="/companion-logs.html">流水线监听</a><a href="/pipeline-batch-test.html">截图批测</a><a href="/role-reaction-test.html">角色批量测试</a></nav>
  <header>
    <div><h1>AI 陪伴流水线监听</h1><p>逐轮查看从视觉编码、记忆理解、角色表演到语音输出的完整输入与输出。</p></div>
    <div class="actions"><select id="taskFilter" aria-label="按任务筛选"><option value="">全部任务</option></select><button id="refresh">刷新</button><button class="danger" id="clear">清空全部</button></div>
  </header>
  <section class="metrics">
    <div>记录数<b id="count">0</b></div><div>成功<b id="success">0</b></div><div>失败<b id="failed">0</b></div><div>平均耗时<b id="average">—</b></div>
  </section>
  <section id="empty" class="empty">还没有流水线记录。</section>
  <section id="logs" class="logs"></section>
  <p class="note">日志最多展示 500 条并在 24 小时后清理。截图仅用于当前调试记录；流水线 JSON 不重复保存图片正文。</p>
</main>
<dialog id="imageDialog"><button id="closeImage" aria-label="关闭">×</button><img id="largeImage" alt="分析截图"></dialog>
<script src="frontend/js/companion-logs-dashboard.js?v=1"></script>
</body>
</html>
