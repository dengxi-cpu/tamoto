<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>伴柠 · 用户行为工作台</title>
  <style>
    :root{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#28233a;background:#f6f4fb}*{box-sizing:border-box}body{margin:0;padding:24px}main{width:min(1280px,100%);margin:auto}h1,h2,p{margin-top:0}h1{font-size:26px;margin-bottom:7px}h2{font-size:17px;margin-bottom:14px}.muted{color:#766f86}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:20px}.actions{display:flex;gap:8px;flex-wrap:wrap}button,select,input{border:1px solid #dcd5e8;background:#fff;border-radius:10px;padding:10px 12px;color:#393149}button{cursor:pointer;font-weight:700}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric,.card{background:#fff;border:1px solid #e7e1ef;border-radius:17px;box-shadow:0 8px 26px rgba(52,41,73,.05)}.metric{padding:16px;color:#766f86;font-size:13px}.metric b{display:block;color:#28233a;font-size:25px;margin:5px 0 2px}.metric small{color:#958da2}.section{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.card{padding:18px;overflow:auto}.insight{border-left:4px solid #7358d6;background:#f4f0ff;padding:13px 15px;border-radius:10px;line-height:1.65;margin-bottom:9px}.insight.good{border-color:#24a06b;background:#edfbf5}.insight.warn{border-color:#e78b2f;background:#fff7ec}.bars{display:grid;gap:10px}.bar-row{display:grid;grid-template-columns:84px 1fr 54px;align-items:center;gap:10px;font-size:13px}.bar-track{height:12px;background:#eeeaf3;border-radius:99px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#8b6ee8,#684ac8);border-radius:99px}table{width:100%;border-collapse:collapse;min-width:720px;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid #eeeaf3}th{color:#766f86;background:#fbfafd}.empty{text-align:center;padding:45px;color:#837b91}.status{margin:14px 0;color:#766f86}.pill{display:inline-block;padding:3px 8px;border-radius:99px;background:#eee9fa;color:#6348bd;font-size:12px}.full{grid-column:1/-1}@media(max-width:900px){body{padding:14px}.grid{grid-template-columns:1fr 1fr}.section{grid-template-columns:1fr}.top{display:block}.actions{margin-top:14px}}@media(max-width:520px){.grid{grid-template-columns:1fr 1fr}.metric b{font-size:21px}}
  </style>
</head>
<body><main>
  <div class="top"><div><h1>伴柠用户行为工作台</h1><p class="muted">看清用户能不能坚持，以及 AI 陪伴是在帮助还是打扰。</p></div><div class="actions"><select id="days"><option value="1">今天</option><option value="7" selected>近 7 天</option><option value="30">近 30 天</option><option value="90">近 90 天</option></select><input id="key" type="password" placeholder="工作台密码（如有）"><button id="refresh">刷新数据</button></div></div>
  <div id="status" class="status">正在读取数据…</div>
  <section class="grid">
    <div class="metric">进入专注页人数<b id="visitors">—</b><small>按设备计算</small></div>
    <div class="metric">开始专注次数<b id="starts">—</b><small id="startRate">点击开始后的成功情况</small></div>
    <div class="metric">专注完成率<b id="completion">—</b><small id="sessionCount">有结果的专注</small></div>
    <div class="metric">平均有效专注<b id="avgFocus">—</b><small>扣除暂停时间</small></div>
    <div class="metric">每次 AI 平均说话<b id="speechAvg">—</b><small>只计算真正播出的语音</small></div>
    <div class="metric">AI 语音播完率<b id="speechComplete">—</b><small>越高表示越少被打断</small></div>
    <div class="metric">用户接话率<b id="engagement">—</b><small>AI 说完 30 秒内有操作</small></div>
    <div class="metric">摄像头使用率<b id="cameraRate">—</b><small>有结果的专注中</small></div>
  </section>
  <section class="section">
    <div class="card"><h2>现在最值得关注</h2><div id="insights"></div></div>
    <div class="card"><h2>用户最常在第几分钟放弃</h2><div id="abandonBars" class="bars"></div></div>
    <div class="card"><h2>不同 AI 内容的表现</h2><div id="speechBars" class="bars"></div><p class="muted" style="margin-top:14px;font-size:12px">播完率高，说明这种内容较少被用户中途打断。</p></div>
    <div class="card"><h2>经典页和 Beta 页</h2><div id="uiCompare" class="bars"></div></div>
    <div class="card full"><h2>最近的专注记录</h2><div id="recent"></div></div>
  </section>
</main>
<script>
const $=id=>document.getElementById(id);let events=[];
const pct=(a,b)=>b?`${Math.round(a/b*100)}%`:'—';
const minutes=s=>`${Math.max(0,Math.round((Number(s)||0)/60))} 分钟`;
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function values(name){return events.filter(e=>e.event===name)}
function barHtml(rows){const max=Math.max(1,...rows.map(x=>x.value));return rows.length?rows.map(x=>`<div class="bar-row"><span>${esc(x.label)}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.max(2,x.value/max*100)}%"></div></div><b>${esc(x.display??x.value)}</b></div>`).join(''):'<div class="empty">还没有足够数据</div>'}
function render(){
  const views=values('focus_page_view'),attempts=values('focus_start_attempt'),starts=values('focus_session_start'),ends=values('focus_session_end');
  const completed=ends.filter(e=>e.props?.completed),speeches=values('ai_speech_started'),speechEnds=values('ai_speech_ended');
  const speechDone=speechEnds.filter(e=>e.props?.outcome==='completed'),interactions=values('user_interaction');
  const engagedSpeech=new Set(interactions.map(e=>e.props?.after_speech_id).filter(Boolean));
  $('visitors').textContent=new Set(views.map(e=>e.device_id)).size;
  $('starts').textContent=starts.length;$('startRate').textContent=`${attempts.length} 次尝试，成功 ${pct(starts.length,attempts.length)}`;
  $('completion').textContent=pct(completed.length,ends.length);$('sessionCount').textContent=`共 ${ends.length} 次有结果的专注`;
  $('avgFocus').textContent=minutes(ends.reduce((s,e)=>s+(Number(e.props?.total_elapsed)||0),0)/(ends.length||1));
  $('speechAvg').textContent=ends.length?(speeches.length/ends.length).toFixed(1)+' 次':'—';
  $('speechComplete').textContent=pct(speechDone.length,speechEnds.length);
  $('engagement').textContent=pct(engagedSpeech.size,speechDone.length);
  $('cameraRate').textContent=pct(ends.filter(e=>e.props?.camera_used).length,ends.length);

  const insights=[];
  if(!ends.length) insights.push(['数据刚开始积累','完成几次专注后，这里会自动给出判断。','']);
  else{
    const rate=completed.length/ends.length;
    insights.push([rate>=.7?'完成情况不错':rate>=.45?'完成率还有提升空间':'很多用户没有坚持到结束',`目前每 100 次专注大约有 ${Math.round(rate*100)} 次完成。`,rate>=.7?'good':'warn']);
    const cancelRate=1-speechDone.length/(speechEnds.length||1);
    if(speechEnds.length>=3) insights.push([cancelRate>.25?'AI 语音被打断较多':'AI 语音接受情况正常',cancelRate>.25?'建议先减少说话频率或缩短文案。':'暂时没有明显的打扰信号。',cancelRate>.25?'warn':'good']);
    if(attempts.length>starts.length) insights.push(['有人点击开始但没能进入专注',`共有 ${attempts.length-starts.length} 次被“未选择状态”等条件挡住。`,'warn']);
  }
  $('insights').innerHTML=insights.map(x=>`<div class="insight ${x[2]}"><b>${esc(x[0])}</b><br>${esc(x[1])}</div>`).join('');

  const buckets={'0–3分':0,'4–10分':0,'11–20分':0,'21分以上':0};
  ends.filter(e=>!e.props?.completed).forEach(e=>{const m=(Number(e.props?.total_elapsed)||0)/60;buckets[m<=3?'0–3分':m<=10?'4–10分':m<=20?'11–20分':'21分以上']++});
  $('abandonBars').innerHTML=barHtml(Object.entries(buckets).map(([label,value])=>({label,value})));
  const types={};speechEnds.forEach(e=>{const start=speeches.find(s=>s.props?.speech_id===e.props?.speech_id);const type=start?.props?.speech_type||'其他';types[type]??={all:0,done:0};types[type].all++;if(e.props?.outcome==='completed')types[type].done++});
  const typeNames={opening:'开场白',visual:'看见状态后回应',encourage:'鼓励',praise:'表扬',presence:'陪伴',activity:'同步活动',dialogue:'对话回复',opening_event:'开场事件'};
  $('speechBars').innerHTML=barHtml(Object.entries(types).map(([k,v])=>({label:typeNames[k]||k,value:v.all?v.done/v.all*100:0,display:pct(v.done,v.all)})).sort((a,b)=>b.value-a.value));
  const uiRows=['classic','beta'].map(ui=>{const list=ends.filter(e=>e.ui===ui);return{label:ui==='beta'?'Beta 页':'经典页',value:list.filter(e=>e.props?.completed).length/(list.length||1)*100,display:`${pct(list.filter(e=>e.props?.completed).length,list.length)} · ${list.length}次`}});
  $('uiCompare').innerHTML=barHtml(uiRows);
  const recent=ends.slice().sort((a,b)=>new Date(b.client_ts)-new Date(a.client_ts)).slice(0,30);
  $('recent').innerHTML=recent.length?`<table><thead><tr><th>时间</th><th>页面</th><th>结果</th><th>有效专注</th><th>暂停</th><th>AI 说话</th><th>用户互动</th><th>摄像头</th></tr></thead><tbody>${recent.map(e=>`<tr><td>${new Date(e.client_ts).toLocaleString()}</td><td><span class="pill">${e.ui==='beta'?'Beta':'经典'}</span></td><td>${e.props?.completed?'✅ 完成':'⏹ 中途结束'}</td><td>${minutes(e.props?.total_elapsed)}</td><td>${Number(e.props?.pause_count)||0} 次</td><td>${Number(e.props?.ai_speech_count)||0} 次</td><td>${Number(e.props?.user_interaction_count)||0} 次</td><td>${e.props?.camera_used?'使用过':'未使用'}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">还没有专注记录</div>';
}
async function load(){
  $('status').textContent='正在读取数据…';const key=$('key').value.trim();if(key)localStorage.setItem('tamotoDashboardKey',key);
  try{const response=await fetch(`/api/events?days=${$('days').value}`,{headers:key?{'x-dashboard-key':key}:{},cache:'no-store'});const payload=await response.json();if(!response.ok)throw new Error(payload.error||`HTTP ${response.status}`);events=(payload.data||[]).filter(item=>item.device_id!=='setup-check');$('status').textContent=`已读取 ${events.length} 条记录 · 更新于 ${new Date().toLocaleTimeString()}`;render()}catch(error){$('status').textContent=`读取失败：${error.message}`;events=[];render()}
}
$('key').value=localStorage.getItem('tamotoDashboardKey')||'';$('refresh').onclick=load;$('days').onchange=load;load();
</script></body></html>
