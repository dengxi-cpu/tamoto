<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>伴柠 · 截图批测工作台</title>
  <link rel="stylesheet" href="frontend/css/pipeline-batch-test.css?v=1">
  <link rel="stylesheet" href="frontend/css/pipeline-prompt-editor.css?v=1">
</head>
<body>
<aside class="sidebar">
  <a class="brand" href="/companion-logs.html"><span>柠</span><b>伴柠调试台</b></a>
  <p class="side-title">AI 陪伴</p>
  <nav>
    <a href="/companion-logs.html">流水线监听</a>
    <a class="active" href="/pipeline-batch-test.html">截图批测</a>
    <a href="/vision-test.html">单帧感知</a>
    <a href="/role-reaction-test.html">角色反应</a>
  </nav>
</aside>
<main>
  <header>
    <div>
      <div class="crumb">AI 陪伴 / 截图批测</div>
      <h1>监督模式 · 截图到 TTS</h1>
      <p>上传视频截图，逐行查看真实专注链路的每一层输入与输出。</p>
    </div>
    <div class="health" id="health"><i></i><span>检查后端配置…</span></div>
  </header>

  <section class="view-tabs"><button class="active">表格</button><span id="summary">0 条记录</span></section>
  <section class="toolbar">
    <label class="upload primary">＋ 上传截图<input id="files" type="file" accept="image/*" multiple></label>
    <button id="runAll">▶ 生成全部</button>
    <button id="clear" class="quiet">清空</button>
    <span class="divider"></span>
    <label>当前任务<input id="task" value="保持专注学习" maxlength="200"></label>
    <label>角色人设<input id="persona" value="毒舌但关心用户的陪伴者，说话自然简短" maxlength="500"></label>
    <label>音色<select id="voice"><option value="zh_male_ruyayichen_saturn_bigtts" data-provider="volcengine">温柔低沉</option><option value="zh_male_m191_uranus_bigtts" data-provider="volcengine">清冷沉稳</option><option value="zh_male_taocheng_uranus_bigtts" data-provider="volcengine">温暖治愈</option><option value="zh_male_liufei_uranus_bigtts" data-provider="volcengine">慵懒自然</option><option value="zh_male_fanjuanqingnian_uranus_bigtts" data-provider="volcengine">清爽青年</option><option value="3b4ekg3VkQNcDNdIvGEo" data-provider="elevenlabs">dady · ElevenLabs</option></select></label>
    <label>音色语言<select id="language"><option value="zh">中文</option><option value="en">English</option></select></label>
  </section>

  <section class="sheet">
    <div class="table-wrap">
      <table>
        <thead><tr><th class="index-col">#</th><th class="shot-col">视频截图</th><th><button class="prompt-link" data-prompt="vlm">VLM 视觉编码 <span>编辑提示词</span></button></th><th><button class="prompt-link" data-prompt="working">Working Memory <span>查看规则</span></button></th><th><button class="prompt-link" data-prompt="memory">Memory LLM <span>编辑提示词</span></button></th><th><button class="prompt-link" data-prompt="actor">Actor LLM / 文案 <span>编辑提示词</span></button></th><th class="audio-col">TTS 输出</th><th class="action-col">操作</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty">
        <div class="empty-icon">▧</div><b>从截图开始一次真实批测</b><span>支持一次选择多张图片；图片仅随请求发送，不会由此页面持久化。</span>
        <label class="upload primary">上传视频截图<input type="file" accept="image/*" multiple data-empty-upload></label>
      </div>
    </div>
    <div class="add-row"><label>＋ 添加截图<input type="file" accept="image/*" multiple data-add-upload></label></div>
  </section>
</main>

<dialog id="detailDialog"><div class="dialog-head"><div><span id="detailStageType">PIPELINE STAGE</span><h2 id="detailTitle">阶段详情</h2></div><button id="closeDetail" aria-label="关闭">×</button></div><div class="io"><section><h3>INPUT 输入</h3><pre id="detailInput"></pre></section><section><h3>OUTPUT 输出</h3><pre id="detailOutput"></pre></section></div></dialog>
<dialog id="promptDialog" class="prompt-dialog"><div class="dialog-head"><div><span>SYSTEM PROMPT</span><h2 id="promptTitle">系统提示词</h2></div><button id="closePrompt" aria-label="关闭">×</button></div><div class="prompt-editor"><p id="promptHint"></p><textarea id="promptText" spellcheck="false"></textarea><div class="prompt-actions"><button id="resetPrompt" class="secondary">恢复后端默认</button><button id="savePrompt" class="primary">保存并用于后续生成</button></div></div></dialog>
<dialog id="imageDialog" class="image-dialog"><button id="closeImage" aria-label="关闭">×</button><img id="largeImage" alt="视频截图大图"></dialog>
<script src="frontend/js/pipeline-batch-test.js?v=2"></script>
</body>
</html>
