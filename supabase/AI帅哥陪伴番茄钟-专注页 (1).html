<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>沈星回 · 专注陪伴 · AI 番茄钟</title>
<style>
  :root{
    /* ---- Design tokens ---- */
    --room-1:#1b1f1c;
    --room-2:#262b26;
    --room-3:#3a4038;
    --warm-glow:#e8b98a;
    --moon-blue:#9fb6d6;

    --ink-100:rgba(255,255,255,0.96);
    --ink-70:rgba(255,255,255,0.74);
    --ink-45:rgba(255,255,255,0.46);

    --glass-fill:rgba(255,255,255,0.10);
    --glass-fill-strong:rgba(255,255,255,0.16);
    --glass-border:rgba(255,255,255,0.28);
    --glass-border-soft:rgba(255,255,255,0.16);

    --accent-warm:#f0c99a;
    --shadow-soft:0 8px 30px rgba(0,0,0,0.35);

    --radius-xl:28px;
    --radius-lg:22px;
    --radius-md:16px;
    --radius-pill:999px;

    --font-ui:-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
    --font-display:-apple-system,"SF Pro Display","PingFang SC",sans-serif;
  }

  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}

  html,body{
    height:100%;
    font-family:var(--font-ui);
    background:
      radial-gradient(circle at 30% 20%, #1c1a22, #0b0a0d 70%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 16px;
    color:var(--ink-100);
  }

  /* ============ DEVICE FRAME ============ */
  .device{
    position:relative;
    width:393px;
    height:852px;
    border-radius:62px;
    padding:14px;
    background:linear-gradient(160deg,#3a3a3d,#111113 60%,#050505);
    box-shadow:0 40px 90px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.04) inset;
  }
  .screen{
    position:relative;
    width:100%;
    height:100%;
    border-radius:48px;
    overflow:hidden;
    background:#000;
  }

  /* ============ BACKGROUND SCENE (AI companion video) ============ */
  .scene{
    position:absolute;
    inset:0;
    /* 若已获得自有素材授权，可将下面这行换成:
       background-image:url('你的图片路径.jpg');
       background-size:cover; background-position:center 20%;
       并删除下方渐变作为兜底底色即可 */
    background:
      radial-gradient(120% 70% at 50% 8%, rgba(200,210,220,0.14), transparent 60%),
      linear-gradient(180deg, var(--room-1) 0%, var(--room-2) 45%, var(--room-3) 100%);
    overflow:hidden;
  }
  /* soft bokeh dots to suggest a blurred lived-in room */
  .scene::before{
    content:"";
    position:absolute; inset:-10%;
    background-image:
      radial-gradient(60px 60px at 18% 22%, rgba(255,205,150,0.28), transparent 70%),
      radial-gradient(90px 90px at 85% 15%, rgba(160,190,230,0.18), transparent 70%),
      radial-gradient(70px 70px at 78% 78%, rgba(255,180,120,0.16), transparent 70%),
      radial-gradient(50px 50px at 10% 82%, rgba(255,255,255,0.08), transparent 70%);
    filter:blur(6px);
  }
  .scene::after{
    /* gentle vignette so overlay text stays legible */
    content:"";
    position:absolute; inset:0;
    background:
      linear-gradient(180deg, rgba(0,0,0,0.42) 0%, rgba(0,0,0,0) 20%, rgba(0,0,0,0) 62%, rgba(0,0,0,0.55) 100%);
  }

  /* ---- Stylised character illustration (placeholder for AI companion video) ---- */
  .character{
    position:absolute;
    left:50%;
    top:15%;
    transform:translateX(-50%);
    width:280px;
    height:auto;
    filter:drop-shadow(0 30px 40px rgba(0,0,0,0.35));
  }

  /* ============ STATUS BAR / DYNAMIC ISLAND ============ */
  .status-bar{
    position:absolute; top:0; left:0; right:0;
    height:54px;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 30px;
    font-size:15px; font-weight:600;
    color:var(--ink-100);
    z-index:30;
    text-shadow:0 1px 6px rgba(0,0,0,0.4);
  }
  .status-bar .icons{display:flex; gap:5px; align-items:center; font-size:13px;}
  .dynamic-island{
    position:absolute; top:12px; left:50%; transform:translateX(-50%);
    width:120px; height:34px; border-radius:20px; background:#000;
    z-index:40;
  }

  /* ============ OVERLAY LAYER ============ */
  .overlay{
    position:absolute; inset:0;
    z-index:20;
    padding:64px 18px 26px;
    display:flex; flex-direction:column;
    justify-content:space-between;
  }

  /* ---- Top row: companion status + BGM/camera ---- */
  .top-row{
    display:flex; justify-content:space-between; align-items:flex-start;
  }

  .companion-block{ max-width:200px; }
  .companion-name{
    display:flex; align-items:center; gap:4px;
    font-size:15px; font-weight:600;
    color:var(--ink-100);
    text-shadow:0 1px 8px rgba(0,0,0,0.45);
  }
  .companion-name .chev{ font-size:12px; color:var(--ink-70); font-weight:400; }
  .companion-sub{
    margin-top:2px;
    font-size:11.5px;
    color:var(--ink-70);
    text-shadow:0 1px 6px rgba(0,0,0,0.4);
  }

  .todo-list{ margin-top:12px; display:flex; flex-direction:column; gap:7px; }
  .todo-row{
    display:flex; align-items:center; gap:7px;
    font-size:12px;
    color:var(--ink-90, var(--ink-100));
    background:var(--glass-fill);
    border:1px solid var(--glass-border-soft);
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    border-radius:var(--radius-pill);
    padding:6px 10px 6px 8px;
    width:fit-content;
    max-width:196px;
  }
  .todo-row .ico{ font-size:12px; flex-shrink:0; }
  .todo-row .label{
    flex:1;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    color:var(--ink-70);
  }
  .todo-row .label b{ color:var(--ink-100); font-weight:600; }
  .todo-row .progress{
    flex-shrink:0;
    font-variant-numeric:tabular-nums;
    font-weight:600;
    font-size:11px;
    color:var(--accent-warm);
    background:rgba(255,255,255,0.10);
    border-radius:var(--radius-pill);
    padding:2px 7px;
  }

  /* ---- Top right: BGM + camera preview ---- */
  .top-right{
    display:flex; flex-direction:column; align-items:flex-end; gap:10px;
  }
  .bgm-pill{
    display:flex; align-items:center; gap:6px;
    font-size:11.5px; font-weight:500;
    color:var(--ink-100);
    background:var(--glass-fill);
    border:1px solid var(--glass-border-soft);
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    border-radius:var(--radius-pill);
    padding:6px 12px 6px 10px;
    white-space:nowrap;
  }
  .bgm-pill .bars{ display:flex; align-items:flex-end; gap:1.5px; height:11px; }
  .bgm-pill .bars span{
    width:2px; background:var(--accent-warm); border-radius:1px;
    animation:eq 1.1s ease-in-out infinite;
  }
  .bgm-pill .bars span:nth-child(1){height:40%; animation-delay:0s;}
  .bgm-pill .bars span:nth-child(2){height:100%; animation-delay:.2s;}
  .bgm-pill .bars span:nth-child(3){height:65%; animation-delay:.4s;}
  @keyframes eq{ 0%,100%{transform:scaleY(0.5);} 50%{transform:scaleY(1);} }

  .self-preview{
    width:76px; height:112px;
    border-radius:18px;
    border:1.5px solid rgba(255,255,255,0.55);
    box-shadow:var(--shadow-soft);
    overflow:hidden;
    position:relative;
    background:linear-gradient(150deg,#4a4038,#211a16 70%);
  }
  .self-preview::before{
    content:"";
    position:absolute; inset:0;
    background:
      radial-gradient(55px 65px at 50% 38%, rgba(230,190,160,0.55), transparent 70%),
      radial-gradient(70px 90px at 50% 95%, rgba(90,70,60,0.9), transparent 70%);
  }
  .self-preview .rec{
    position:absolute; top:6px; left:6px;
    display:flex; align-items:center; gap:3px;
    font-size:8.5px; font-weight:700; letter-spacing:.3px;
    color:#fff;
  }
  .self-preview .rec i{
    width:5px; height:5px; border-radius:50%; background:#ff5b52;
    box-shadow:0 0 5px #ff5b52;
  }

  /* ---- Chat bubbles ---- */
  .chat-stack{
    align-self:flex-start;
    display:flex; flex-direction:column; gap:6px;
    max-width:78%;
    margin-top:auto;
    margin-bottom:14px;
  }
  .bubble{
    font-size:12.5px; line-height:1.4;
    padding:8px 13px;
    border-radius:16px;
    backdrop-filter:blur(16px) saturate(150%);
    -webkit-backdrop-filter:blur(16px) saturate(150%);
    width:fit-content;
    box-shadow:0 6px 18px rgba(0,0,0,0.18);
  }
  .bubble.ai{
    background:var(--glass-fill-strong);
    border:1px solid var(--glass-border-soft);
    border-bottom-left-radius:6px;
    color:var(--ink-100);
  }
  .bubble.me{
    align-self:flex-end;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.32);
    color:var(--ink-100);
    font-weight:500;
    border-bottom-right-radius:6px;
  }

  /* ---- Timer ---- */
  .timer-block{
    align-self:center;
    text-align:center;
    margin-bottom:22px;
  }
  .timer-value{
    font-family:var(--font-display);
    font-size:58px;
    font-weight:300;
    letter-spacing:1px;
    color:var(--ink-100);
    font-variant-numeric:tabular-nums;
    text-shadow:0 4px 24px rgba(0,0,0,0.45);
    line-height:1;
  }
  .timer-caption{
    margin-top:6px;
    font-size:12px;
    letter-spacing:.5px;
    color:var(--ink-70);
    text-shadow:0 1px 6px rgba(0,0,0,0.4);
  }
  .timer-caption .dot{ color:var(--accent-warm); margin:0 5px; }

  /* ---- Bottom controls ---- */
  .controls-row{
    display:flex; align-items:center; justify-content:center;
    gap:22px;
    margin-bottom:16px;
  }
  .ctrl-btn{
    width:52px; height:52px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--glass-fill-strong);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(20px) saturate(150%);
    -webkit-backdrop-filter:blur(20px) saturate(150%);
    box-shadow:var(--shadow-soft);
    font-size:19px;
    color:var(--ink-100);
  }
  .ctrl-btn.primary{
    width:64px; height:64px;
    font-size:22px;
    background:linear-gradient(160deg, rgba(255,255,255,0.34), rgba(255,255,255,0.12));
    border:1px solid rgba(255,255,255,0.45);
  }

  /* ---- Chat input ---- */
  .chat-input{
    display:flex; align-items:center; gap:8px;
    background:var(--glass-fill);
    border:1px solid var(--glass-border-soft);
    backdrop-filter:blur(20px) saturate(150%);
    -webkit-backdrop-filter:blur(20px) saturate(150%);
    border-radius:var(--radius-pill);
    padding:9px 9px 9px 16px;
  }
  .chat-input .placeholder{
    flex:1;
    font-size:13px;
    color:var(--ink-45);
  }
  .chat-input .send-btn{
    width:32px; height:32px;
    border-radius:50%;
    background:var(--accent-warm);
    display:flex; align-items:center; justify-content:center;
    font-size:13px;
    color:#3a2410;
    flex-shrink:0;
  }

  .home-indicator{
    position:absolute; bottom:8px; left:50%; transform:translateX(-50%);
    width:134px; height:5px; border-radius:3px;
    background:rgba(255,255,255,0.85);
    z-index:40;
  }

  /* caption under device for context, not part of the UI */
  .frame-caption{
    position:absolute;
    bottom:-42px; left:0; right:0;
    text-align:center;
    font-size:12px;
    color:rgba(255,255,255,0.35);
    letter-spacing:.4px;
  }
</style>
</head>
<body>

<div class="device">
  <div class="frame-caption">AI 帅哥陪伴型番茄钟 · 专注页 · iPhone 393×852</div>
  <div class="screen">

    <!-- 背景：AI 陪伴视频画面 -->
    <div class="scene">
      <svg class="character" viewBox="0 0 340 430" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f4d3b8"/>
            <stop offset="100%" stop-color="#e6b795"/>
          </linearGradient>
          <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#c7c8cc"/>
            <stop offset="100%" stop-color="#8b8d94"/>
          </linearGradient>
          <linearGradient id="sweater" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#5b6068"/>
            <stop offset="100%" stop-color="#33363c"/>
          </linearGradient>
          <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f4f2ee"/>
            <stop offset="100%" stop-color="#d8d5cf"/>
          </linearGradient>
          <linearGradient id="tie" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#7a2f2f"/>
            <stop offset="100%" stop-color="#4c1c1c"/>
          </linearGradient>
          <linearGradient id="book" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#cbb18a"/>
            <stop offset="100%" stop-color="#9d7f57"/>
          </linearGradient>
        </defs>

        <!-- shoulders / vest -->
        <path d="M40 430 Q 55 300 130 280 Q 170 268 210 280 Q 285 300 300 430 Z" fill="url(#sweater)"/>
        <!-- shirt collar -->
        <path d="M136 288 Q 150 320 170 336 Q 190 320 204 288 L 190 278 Q 170 300 150 278 Z" fill="url(#shirt)"/>
        <!-- tie -->
        <path d="M162 292 L 178 292 L 184 320 L 170 384 L 156 320 Z" fill="url(#tie)"/>
        <!-- vest V neckline trim -->
        <path d="M124 296 Q 170 330 216 296 L 210 282 Q 170 312 130 282 Z" fill="#454951" opacity="0.6"/>

        <!-- neck -->
        <rect x="150" y="248" width="40" height="46" rx="14" fill="url(#skin)"/>

        <!-- head -->
        <ellipse cx="170" cy="190" rx="68" ry="78" fill="url(#skin)"/>

        <!-- ears -->
        <ellipse cx="104" cy="196" rx="9" ry="14" fill="#eec19f"/>
        <ellipse cx="236" cy="196" rx="9" ry="14" fill="#eec19f"/>

        <!-- hair back -->
        <path d="M98 196 Q 86 96 170 86 Q 254 96 242 196 Q 250 150 234 116 Q 204 92 170 92 Q 136 92 106 116 Q 90 150 98 196 Z" fill="url(#hair)"/>
        <!-- hair front / soft side-parted fringe -->
        <path d="M108 176 Q 104 118 150 102 Q 132 128 140 158 Q 118 150 112 176 Z" fill="url(#hair)"/>
        <path d="M232 176 Q 236 118 190 102 Q 208 128 200 158 Q 222 150 228 176 Z" fill="url(#hair)"/>
        <path d="M140 158 Q 158 128 170 104 Q 182 128 200 158 Q 186 140 170 138 Q 154 140 140 158 Z" fill="url(#hair)"/>
        <path d="M150 106 Q 160 118 158 134" stroke="#8b8d94" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
        <path d="M190 106 Q 180 118 182 134" stroke="#8b8d94" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>

        <!-- brows -->
        <path d="M136 176 Q 150 170 164 175" stroke="#6b6d73" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M178 175 Q 192 169 206 175" stroke="#6b6d73" stroke-width="4" fill="none" stroke-linecap="round"/>

        <!-- eyes -->
        <path d="M138 190 Q 150 184 164 190 Q 152 196 138 190Z" fill="#2b3138"/>
        <path d="M178 190 Q 190 184 204 190 Q 192 196 178 190Z" fill="#2b3138"/>
        <circle cx="150" cy="188" r="1.6" fill="#fff" opacity="0.8"/>
        <circle cx="190" cy="188" r="1.6" fill="#fff" opacity="0.8"/>

        <!-- glasses (thin frameless) -->
        <ellipse cx="151" cy="192" rx="21" ry="17" fill="none" stroke="#d9dade" stroke-width="1.6" opacity="0.85"/>
        <ellipse cx="191" cy="192" rx="21" ry="17" fill="none" stroke="#d9dade" stroke-width="1.6" opacity="0.85"/>
        <path d="M172 192 L 170 190 L 168 192" stroke="#d9dade" stroke-width="1.6" fill="none" opacity="0.85"/>
        <path d="M130 188 L 116 182" stroke="#d9dade" stroke-width="1.6" opacity="0.7"/>
        <path d="M212 188 L 226 182" stroke="#d9dade" stroke-width="1.6" opacity="0.7"/>

        <!-- nose -->
        <path d="M170 196 Q 166 210 170 216" stroke="#d9a97f" stroke-width="2.5" fill="none" stroke-linecap="round"/>

        <!-- lips (soft, closed, calm) -->
        <path d="M154 226 Q 170 233 186 226" stroke="#b6795e" stroke-width="3" fill="none" stroke-linecap="round"/>

        <!-- cheeks blush, faint -->
        <ellipse cx="132" cy="208" rx="11" ry="6" fill="#e7a98c" opacity="0.28"/>
        <ellipse cx="208" cy="208" rx="11" ry="6" fill="#e7a98c" opacity="0.28"/>

        <!-- arm + open book -->
        <path d="M112 336 Q 92 378 108 422 L 172 422 Q 166 380 154 348 Z" fill="url(#sweater)"/>
        <path d="M98 400 Q 130 386 160 400 L 160 424 Q 130 414 98 424 Z" fill="url(#book)"/>
        <path d="M160 400 Q 190 386 220 400 L 220 424 Q 190 414 160 424 Z" fill="#c2a37a"/>
        <path d="M160 400 L 160 424" stroke="#7a5f3d" stroke-width="1.5" opacity="0.5"/>
        <path d="M104 405 Q 128 396 154 406" stroke="#8a6f4a" stroke-width="1.2" fill="none" opacity="0.55"/>
        <path d="M166 405 Q 190 396 214 406" stroke="#8a6f4a" stroke-width="1.2" fill="none" opacity="0.55"/>
      </svg>
    </div>

    <!-- 状态栏 / 灵动岛 -->
    <div class="status-bar">
      <span>9:41</span>
      <div class="icons">
        <span>••••</span><span>Wi‑Fi</span><span>🔋</span>
      </div>
    </div>
    <div class="dynamic-island"></div>

    <!-- 悬浮 UI 层 -->
    <div class="overlay">

      <div class="top-row">
        <div class="companion-block">
          <div class="companion-name">沈星回 · 专注陪伴中 <span class="chev">›</span></div>
          <div class="companion-sub">和你进步的第 20 天</div>

          <div class="todo-list">
            <div class="todo-row">
              <span class="ico">📖</span>
              <span class="label"><b>沈星回</b> · 阅读 20 页</span>
              <span class="progress">12/20</span>
            </div>
            <div class="todo-row">
              <span class="ico">✓</span>
              <span class="label"><b>我</b> · 学习单词 20 个</span>
              <span class="progress">8/20</span>
            </div>
          </div>
        </div>

        <div class="top-right">
          <div class="bgm-pill">
            <span class="bars"><span></span><span></span><span></span></span>
            Snowfall · Lo‑fi
          </div>
          <div class="self-preview">
            <div class="rec"><i></i>LIVE</div>
          </div>
        </div>
      </div>

      <div class="chat-stack">
        <div class="bubble ai">今天状态很不错哦。</div>
        <div class="bubble ai">我再陪你看一会儿书。</div>
        <div class="bubble me">好，一起学。</div>
      </div>

      <div class="timer-block">
        <div class="timer-value">24:36</div>
        <div class="timer-caption">专注中<span class="dot">·</span>第 2 个番茄</div>
      </div>

      <div class="controls-row">
        <div class="ctrl-btn" aria-label="麦克风">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <rect x="9" y="2.5" width="6" height="12" rx="3" stroke="currentColor" stroke-width="1.6"/>
            <path d="M6 11.5v1a6 6 0 0 0 12 0v-1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M12 18.5v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M9 21.5h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="ctrl-btn primary" aria-label="暂停">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <rect x="6.5" y="4.5" width="4" height="15" rx="1.6" fill="currentColor"/>
            <rect x="13.5" y="4.5" width="4" height="15" rx="1.6" fill="currentColor"/>
          </svg>
        </div>
        <div class="ctrl-btn" aria-label="摄像头">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none">
            <rect x="2.5" y="6.5" width="14" height="11" rx="3" stroke="currentColor" stroke-width="1.6"/>
            <path d="M16.5 10.2 21 8v8l-4.5-2.2" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>

      <div class="chat-input">
        <span class="placeholder">和沈星回说点什么…</span>
        <div class="send-btn">➤</div>
      </div>

    </div>

    <div class="home-indicator"></div>
  </div>
</div>

</body>
</html>
