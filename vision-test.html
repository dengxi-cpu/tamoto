<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>伴柠 · 感知反应测试台</title>
  <style>
    :root { color-scheme: light; font-family: Inter,"PingFang SC","Microsoft YaHei",sans-serif; background:#f6f4fb; color:#292337; }
    * { box-sizing:border-box; }
    body { margin:0; padding:24px; }
    main { width:min(1180px,100%); margin:auto; }
    header { display:flex; justify-content:space-between; gap:20px; align-items:flex-start; margin-bottom:18px; }
    h1 { margin:0 0 6px; font-size:24px; }
    p { margin:0; color:#756d85; }
    .health { padding:9px 13px; border-radius:999px; background:#eeeaf5; font-size:13px; white-space:nowrap; }
    .health.ok { color:#087b4c; background:#dcf7ea; }
    .health.bad { color:#b42318; background:#fee4e2; }
    .grid { display:grid; grid-template-columns:minmax(0,1.2fr) minmax(330px,.8fr); gap:18px; }
    .card { background:#fff; border:1px solid #e5dfef; border-radius:18px; padding:18px; box-shadow:0 8px 30px rgba(55,42,80,.06); }
    .stage { position:relative; aspect-ratio:4/3; overflow:hidden; border-radius:14px; background:#1f1b26; display:grid; place-items:center; }
    video,img { width:100%; height:100%; object-fit:contain; }
    img[hidden],video[hidden] { display:none; }
    .placeholder { color:#aaa1b9; text-align:center; padding:30px; }
    .result-badge { position:absolute; left:14px; top:14px; padding:8px 12px; border-radius:999px; color:#fff; background:rgba(20,17,25,.78); font-weight:800; letter-spacing:.04em; }
    .controls { display:flex; flex-wrap:wrap; gap:9px; margin-top:14px; align-items:center; }
    button,.upload { border:1px solid #d9d1e6; background:#fff; color:#3b3150; padding:10px 14px; border-radius:10px; cursor:pointer; font-weight:700; font-size:14px; }
    button.primary { background:#7157d9; color:#fff; border-color:#7157d9; }
    button.danger { color:#b42318; }
    button:disabled { opacity:.45; cursor:not-allowed; }
    input[type=file] { display:none; }
    select { padding:9px 10px; border:1px solid #d9d1e6; border-radius:9px; background:#fff; }
    .settings { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0; }
    .field { display:grid; gap:6px; color:#756d85; font-size:12px; }
    .field input { width:100%; padding:10px 11px; border:1px solid #d9d1e6; border-radius:10px; color:#292337; background:#fff; font:14px inherit; }
    h2 { margin:0 0 12px; font-size:16px; }
    pre { min-height:160px; max-height:300px; overflow:auto; margin:0; padding:14px; border-radius:12px; background:#211d29; color:#e8e2f3; font:12px/1.55 Consolas,monospace; white-space:pre-wrap; word-break:break-word; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th,td { text-align:left; padding:9px 7px; border-bottom:1px solid #eee9f4; }
    th { color:#756d85; font-weight:600; }
    .history-shot { width:92px; height:64px; object-fit:cover; border-radius:8px; background:#211d29; cursor:zoom-in; display:block; }
    .shot-dialog { width:min(900px,92vw); padding:0; border:0; border-radius:14px; overflow:hidden; background:#17131e; box-shadow:0 24px 80px rgba(0,0,0,.35); }
    .shot-dialog::backdrop { background:rgba(16,12,22,.72); }
    .shot-dialog img { display:block; width:100%; height:auto; max-height:82vh; object-fit:contain; }
    .history { max-height:300px; overflow:auto; }
    .meta { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin:12px 0 16px; font-size:13px; }
    .meta div { padding:10px; background:#f7f5fa; border-radius:10px; }
    .meta b { display:block; margin-top:3px; word-break:break-all; }
    .note { margin-top:12px; font-size:12px; color:#81798f; }
    .toggle { display:inline-flex; align-items:center; gap:7px; color:#514664; font-size:13px; font-weight:700; }
    .toggle input { width:16px; height:16px; accent-color:#7157d9; }
    .pipeline { display:grid; gap:10px; margin-bottom:14px; }
    .pipeline-item { padding:12px; border-radius:12px; background:#f7f5fa; }
    .pipeline-item span { display:block; color:#756d85; font-size:11px; margin-bottom:5px; }
    .pipeline-item strong { display:block; line-height:1.55; word-break:break-word; }
    @media(max-width:820px){ body{padding:14px}.grid{grid-template-columns:1fr}header{display:block}.health{display:inline-block;margin-top:12px} }
  </style>
</head>
<body>
<main>
  <header>
    <div><h1>感知 → AI 反应测试台</h1><p>测试可直接复用到伴柠的“摄像头描述 → 人设反应”后端管线。 · <a href="/companion-logs.html">查看正式番茄钟日志</a></p></div>
    <div class="health" id="health">正在检查后端配置…</div>
  </header>
  <div class="grid">
    <section class="card">
      <div class="stage">
        <video id="video" autoplay muted playsinline hidden></video>
        <img id="image" alt="待分析图片" hidden>
        <div class="placeholder" id="placeholder">开启摄像头，或上传一张图片</div>
        <div class="result-badge" id="badge">WAITING</div>
      </div>
      <div class="settings">
        <label class="field">当前任务<input id="task" value="保持专注学习" maxlength="200"></label>
        <label class="field">角色人设<input id="persona" value="毒舌但关心用户的陪伴者" maxlength="500"></label>
      </div>
      <div class="controls">
        <button id="camera">开启摄像头</button>
        <label class="upload">上传图片<input id="file" type="file" accept="image/*"></label>
        <button class="primary" id="analyze">运行完整链路</button>
        <select id="interval" aria-label="自动分析间隔">
          <option value="0">关闭自动分析</option>
          <option value="10">每 10 秒</option>
          <option value="30" selected>每 30 秒</option>
          <option value="60">每 60 秒</option>
        </select>
        <button id="auto">开始自动分析</button>
        <label class="toggle"><input id="speak" type="checkbox" checked>自动流式播报</label>
        <button id="stopAudio">停止播报</button>
        <button class="danger" id="clear">清空记录</button>
      </div>
      <div class="note">每轮只处理最新截图；上一轮未完成时跳过新请求。截图不落盘，后端只返回结构化描述与一句反应。</div>
    </section>
    <aside>
      <section class="card">
        <h2>本次完整链路</h2>
        <div class="pipeline">
          <div class="pipeline-item"><span>视觉模型描述</span><strong id="scene">等待运行…</strong></div>
          <div class="pipeline-item"><span>AI 一句话反应</span><strong id="reaction">等待运行…</strong></div>
        </div>
        <div class="meta">
          <div>Epoch / Turn<b id="turn">—</b></div>
          <div>视觉耗时<b id="visionLatency">—</b></div>
          <div>反应耗时<b id="reactionLatency">—</b></div>
          <div>总耗时<b id="latency">—</b></div>
          <div>TTS 首字节<b id="ttsLatency">—</b></div>
          <div>播放状态<b id="playbackStatus">等待</b></div>
          <div>HTTP<b id="http">—</b></div>
        </div>
        <pre id="raw">等待测试…</pre>
      </section>
      <section class="card" style="margin-top:18px">
        <h2>管线历史（仅当前页面）</h2>
        <div class="history"><table><thead><tr><th>轮次</th><th>分析截图</th><th>视觉描述</th><th>AI 反应</th><th>总耗时</th></tr></thead><tbody id="history"></tbody></table></div>
      </section>
    </aside>
  </div>
</main>
<dialog class="shot-dialog" id="shotDialog"><img id="shotLarge" alt="本轮分析截图"></dialog>
<script>
  const $ = id => document.getElementById(id);
  let stream = null;
  let source = null;
  let timer = null;
  let busy = false;
  let epoch = Date.now();
  let nextTurnId = 0;
  let activeController = null;
  let audioContext = null;
  let gainNode = null;
  let currentPlayback = null;
  const TARGET_BUFFER_MS = 180;

  async function checkHealth() {
    try {
      const response = await fetch('/api/vision-health', { cache:'no-store' });
      const payload = await response.json();
      const data = payload.data || {};
      const ready = data.configured && data.reactionConfigured;
      const ttsReady = data.ttsKeyConfigured && data.ttsVoiceConfigured;
      $('health').textContent = ready
        ? `视觉 + 反应已配置 · TTS ${ttsReady ? '已配置' : '待音色配置'}`
        : '视觉或反应模型配置不完整';
      $('health').className = `health ${ready ? 'ok' : 'bad'}`;
    } catch (error) {
      $('health').textContent = '后端健康检查失败';
      $('health').className = 'health bad';
    }
  }

  async function toggleCamera() {
    if (stream) return stopCamera();
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user',width:{ideal:640},height:{ideal:480} }, audio:false });
      $('video').srcObject = stream;
      $('video').hidden = false;
      $('image').hidden = true;
      $('placeholder').hidden = true;
      source = 'camera';
      $('camera').textContent = '关闭摄像头';
    } catch (error) { showError(`摄像头开启失败：${error.message}`); }
  }

  function stopCamera() {
    stream?.getTracks().forEach(track => track.stop());
    stream = null;
    $('video').srcObject = null;
    $('video').hidden = true;
    $('camera').textContent = '开启摄像头';
    if (source === 'camera') { source = null; $('placeholder').hidden = false; }
    epoch += 1;
    activeController?.abort();
    stopPlayback('摄像头已关闭');
  }

  function capture() {
    const element = source === 'camera' ? $('video') : $('image');
    const width = element.videoWidth || element.naturalWidth;
    const height = element.videoHeight || element.naturalHeight;
    if (!width || !height) throw new Error('请先开启摄像头或上传图片');
    const scale = Math.min(1, 640 / width);
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(width * scale); canvas.height = Math.round(height * scale);
    canvas.getContext('2d').drawImage(element, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL('image/jpeg', .72);
  }

  async function ensureAudio() {
    if (!audioContext) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) throw new Error('当前浏览器不支持流式音频播放');
      audioContext = new AudioContextClass();
      gainNode = audioContext.createGain();
      gainNode.connect(audioContext.destination);
    }
    if (audioContext.state === 'suspended') await audioContext.resume();
  }

  function stopPlayback(reason = '已停止') {
    if (!currentPlayback) return;
    const playback = currentPlayback;
    currentPlayback = null;
    playback.controller?.abort();
    playback.sources.forEach(source => {
      source.onended = null;
      try { source.stop(); } catch (_) {}
    });
    playback.sources.clear();
    playback.resolve?.(false);
    $('playbackStatus').textContent = reason;
  }

  function maybeFinishPlayback(playback) {
    if (currentPlayback !== playback || !playback.streamEnded || playback.sources.size) return;
    currentPlayback = null;
    $('playbackStatus').textContent = '播放完成';
    $('badge').textContent = 'DONE';
    playback.resolve?.(true);
  }

  function schedulePcmChunk(bytes, playback) {
    if (currentPlayback !== playback || playback.epoch !== epoch) return;
    let data = bytes;
    if (playback.carry !== null) {
      const merged = new Uint8Array(bytes.length + 1);
      merged[0] = playback.carry; merged.set(bytes, 1); data = merged; playback.carry = null;
    }
    if (data.length % 2) { playback.carry = data[data.length - 1]; data = data.slice(0, -1); }
    if (!data.length) return;
    const samples = data.length / 2;
    const audioBuffer = audioContext.createBuffer(1, samples, playback.sampleRate);
    const channel = audioBuffer.getChannelData(0);
    const view = new DataView(data.buffer, data.byteOffset, data.byteLength);
    for (let i = 0; i < samples; i++) channel[i] = view.getInt16(i * 2, true) / 32768;
    const sourceNode = audioContext.createBufferSource();
    sourceNode.buffer = audioBuffer;
    sourceNode.connect(gainNode);
    const minimumStart = audioContext.currentTime + TARGET_BUFFER_MS / 1000;
    if (playback.nextPlayTime < minimumStart) playback.nextPlayTime = minimumStart;
    sourceNode.start(playback.nextPlayTime);
    playback.nextPlayTime += audioBuffer.duration;
    playback.sources.add(sourceNode);
    sourceNode.onended = () => {
      playback.sources.delete(sourceNode);
      maybeFinishPlayback(playback);
    };
  }

  async function playStreamingTts(text, result) {
    await ensureAudio();
    stopPlayback('切换到新反应');
    const controller = new AbortController();
    const playback = {
      epoch: result.epoch,
      turnId: result.turnId,
      controller,
      sources: new Set(),
      nextPlayTime: 0,
      streamEnded: false,
      carry: null,
      sampleRate: 24000,
      resolve: null
    };
    currentPlayback = playback;
    $('playbackStatus').textContent = '正在请求 TTS…';
    $('ttsLatency').textContent = '—';
    const started = performance.now();

    const finished = new Promise(resolve => { playback.resolve = resolve; });
    try {
      const response = await fetch('/api/tts-stream', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        signal:controller.signal,
        body:JSON.stringify({ text, epoch:result.epoch, turnId:result.turnId })
      });
      if (!response.ok) {
        const payload = await response.json().catch(() => ({}));
        throw new Error(payload.error || `TTS HTTP ${response.status}`);
      }
      playback.sampleRate = Number(response.headers.get('x-audio-sample-rate')) || 24000;
      const reader = response.body.getReader();
      let firstChunk = true;
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        if (currentPlayback !== playback || playback.epoch !== epoch) { controller.abort(); break; }
        if (value?.length) {
          if (firstChunk) {
            firstChunk = false;
            $('ttsLatency').textContent = `${Math.round(performance.now() - started)} ms`;
            $('playbackStatus').textContent = '流式播放中';
            $('badge').textContent = 'SPEAKING';
          }
          schedulePcmChunk(value, playback);
        }
      }
      if (firstChunk) throw new Error('TTS 没有返回音频');
      playback.streamEnded = true;
      maybeFinishPlayback(playback);
      return await finished;
    } catch (error) {
      if (error.name === 'AbortError') return false;
      if (currentPlayback === playback) {
        currentPlayback = null;
        playback.sources.forEach(source => { try { source.stop(); } catch (_) {} });
        playback.resolve?.(false);
      }
      $('playbackStatus').textContent = `失败：${error.message}`;
      throw error;
    }
  }

  async function analyze() {
    if (busy) return;
    busy = true; $('analyze').disabled = true; $('badge').textContent = 'ANALYZING…';
    const started = performance.now();
    const requestEpoch = epoch;
    const turnId = ++nextTurnId;
    activeController = new AbortController();
    if ($('speak').checked) await ensureAudio().catch(error => showError(error.message));
    $('turn').textContent = `${requestEpoch} / ${turnId}`;
    $('scene').textContent = '正在理解画面…';
    $('reaction').textContent = '等待视觉描述…';
    try {
      const capturedImage = capture();
      const response = await fetch('/api/companion-observe', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        signal: activeController.signal,
        body:JSON.stringify({
          image:capturedImage,
          task:$('task').value.trim(),
          persona:$('persona').value.trim(),
          epoch:requestEpoch,
          turnId
        })
      });
      const payload = await response.json().catch(() => ({}));
      const elapsed = Math.round(performance.now() - started);
      $('http').textContent = response.status;
      $('latency').textContent = `${elapsed} ms`;
      $('raw').textContent = JSON.stringify(payload, null, 2);
      if (!response.ok) throw new Error(`${payload.stage ? `[${payload.stage}] ` : ''}${payload.error || `HTTP ${response.status}`}`);
      const result = payload.data || {};
      if (result.epoch !== epoch) return;
      $('scene').textContent = result.observation?.scene || '—';
      $('reaction').textContent = result.reaction || '—';
      $('visionLatency').textContent = `${result.timings?.visionMs ?? '—'} ms`;
      $('reactionLatency').textContent = `${result.timings?.reactionMs ?? '—'} ms`;
      $('latency').textContent = `${result.timings?.totalMs ?? elapsed} ms`;
      $('badge').textContent = 'REACTION READY';
      addHistory(result, elapsed, capturedImage);
      if ($('speak').checked && result.reaction) await playStreamingTts(result.reaction, result);
    } catch (error) { if (error.name !== 'AbortError') showError(error.message); }
    finally { busy = false; activeController = null; $('analyze').disabled = false; }
  }

  function showError(message) { $('badge').textContent='ERROR'; $('reaction').textContent=message; $('raw').textContent=message; }
  function addHistory(result, elapsed, capturedImage) {
    const row = document.createElement('tr');
    const turnCell = document.createElement('td');
    turnCell.textContent = `#${result.turnId}`;
    row.appendChild(turnCell);
    const imageCell = document.createElement('td');
    const thumbnail = document.createElement('img');
    thumbnail.className = 'history-shot';
    thumbnail.src = capturedImage;
    thumbnail.alt = `第 ${result.turnId} 轮分析截图`;
    thumbnail.title = '点击查看大图';
    thumbnail.addEventListener('click', () => {
      $('shotLarge').src = capturedImage;
      $('shotDialog').showModal();
    });
    imageCell.appendChild(thumbnail);
    row.appendChild(imageCell);
    [
      result.observation?.scene || '—',
      result.reaction || '—',
      `${result.timings?.totalMs ?? elapsed} ms`
    ].forEach(value => { const cell=document.createElement('td'); cell.textContent=value; row.appendChild(cell); });
    $('history').prepend(row);
  }
  function toggleAuto() {
    if (timer) { clearInterval(timer); timer=null; $('auto').textContent='开始自动分析'; return; }
    const seconds = Number($('interval').value);
    if (!seconds) return showError('请先选择自动分析间隔');
    analyze(); timer=setInterval(analyze, seconds*1000); $('auto').textContent='停止自动分析';
  }

  $('camera').addEventListener('click', toggleCamera);
  $('analyze').addEventListener('click', analyze);
  $('auto').addEventListener('click', toggleAuto);
  $('stopAudio').addEventListener('click', () => stopPlayback('用户停止'));
  $('shotDialog').addEventListener('click', event => { if (event.target === $('shotDialog')) $('shotDialog').close(); });
  $('clear').addEventListener('click', () => { $('history').replaceChildren(); $('raw').textContent='记录已清空'; });
  $('file').addEventListener('change', event => {
    const file = event.target.files?.[0]; if (!file) return;
    stopCamera(); const url=URL.createObjectURL(file); $('image').src=url; $('image').hidden=false; $('placeholder').hidden=true; source='image';
    $('image').onload=()=>URL.revokeObjectURL(url);
  });
  window.addEventListener('pagehide', () => { stopCamera(); if(timer) clearInterval(timer); activeController?.abort(); });
  checkHealth();
</script>
</body>
</html>
