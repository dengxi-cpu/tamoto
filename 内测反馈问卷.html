<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>伴柠番茄钟 · 内测反馈问卷</title>
<style>
  :root {
    --grad-from: #a855f7;
    --grad-to: #ec4899;
    --ink: #1e293b;
    --muted: #64748b;
    --card: rgba(255,255,255,0.72);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: linear-gradient(160deg, #f5f3ff 0%, #fdf2f8 100%);
    color: var(--ink);
    min-height: 100vh;
    padding: 24px 14px 120px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 22px; }
  header h1 {
    font-size: 24px; font-weight: 800;
    background: linear-gradient(90deg, var(--grad-from), var(--grad-to));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  header p { color: var(--muted); font-size: 13px; margin-top: 8px; line-height: 1.6; }
  header .device { font-size: 11px; color: #a78bfa; margin-top: 6px; }

  .progress-bar {
    position: sticky; top: 0; z-index: 20;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(8px);
    border-radius: 999px;
    height: 8px; overflow: hidden;
    box-shadow: 0 1px 6px rgba(168,85,247,0.15);
    margin-bottom: 24px;
  }
  .progress-bar i {
    display: block; height: 100%;
    background: linear-gradient(90deg, var(--grad-from), var(--grad-to));
    transition: width .3s ease;
    width: 0%;
  }

  .section-label {
    font-size: 13px; font-weight: 700; letter-spacing: 1px;
    color: var(--grad-from); margin: 26px 0 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-label::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(168,85,247,.35), transparent); }

  .q-card {
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.9);
    border-radius: 18px;
    padding: 18px 18px 16px;
    margin-bottom: 14px;
    box-shadow: 0 4px 18px rgba(168,85,247,0.08);
    backdrop-filter: blur(4px);
  }
  .q-card.missing { border-color: #fda4af; box-shadow: 0 0 0 3px rgba(244,63,94,.15); }
  .q-title { font-size: 15px; font-weight: 700; line-height: 1.5; margin-bottom: 12px; }
  .q-title .num {
    display: inline-block; min-width: 22px; text-align: center;
    background: linear-gradient(90deg, var(--grad-from), var(--grad-to));
    color: #fff; font-size: 12px; border-radius: 7px;
    padding: 2px 6px; margin-right: 8px;
  }
  .q-title .req { color: #f43f5e; margin-left: 4px; font-weight: 400; }
  .hint { font-size: 12px; color: var(--muted); margin: -6px 0 10px 34px; line-height: 1.5; }

  .opt { display: flex; align-items: flex-start; gap: 10px; padding: 9px 10px; border-radius: 12px; cursor: pointer; transition: background .15s; }
  .opt:hover { background: rgba(168,85,247,0.06); }
  .opt input { margin-top: 3px; accent-color: #a855f7; width: 17px; height: 17px; flex: none; }
  .opt span { font-size: 14px; line-height: 1.5; }
  .opt input[type="text"] {
    flex: 1; width: 100%; margin-top: 0;
    border: 1px solid #e2e8f0; border-radius: 10px; padding: 8px 10px; font-size: 14px;
    outline: none; background: #fff;
  }
  .opt input[type="text"]:focus { border-color: #a855f7; box-shadow: 0 0 0 3px rgba(168,85,247,.12); }

  textarea {
    width: 100%; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px;
    font-size: 14px; font-family: inherit; line-height: 1.6;
    outline: none; background: #fff; resize: vertical; min-height: 84px;
  }
  textarea:focus { border-color: #a855f7; box-shadow: 0 0 0 3px rgba(168,85,247,.12); }
  .q-card textarea { margin-left: 34px; width: calc(100% - 34px); min-height: 64px; }

  .toolbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(10px);
    border-top: 1px solid rgba(168,85,247,0.12);
    padding: 12px 14px;
    display: flex; gap: 10px; justify-content: center;
  }
  .toolbar .wrap { display: flex; gap: 10px; width: 100%; max-width: 640px; }
  button {
    border: none; cursor: pointer; font-size: 15px; font-weight: 700;
    padding: 13px 18px; border-radius: 14px; transition: transform .1s, opacity .15s;
  }
  button:active { transform: scale(.97); }
  .btn-primary {
    flex: 1;
    background: linear-gradient(90deg, var(--grad-from), var(--grad-to));
    color: #fff;
    box-shadow: 0 6px 18px rgba(168,85,247,0.35);
  }
  .btn-primary:disabled { opacity: .4; box-shadow: none; cursor: not-allowed; }
  .btn-ghost { background: #f1f5f9; color: var(--muted); }

  .modal-mask {
    position: fixed; inset: 0; z-index: 50; display: none;
    background: rgba(15,23,42,0.5); backdrop-filter: blur(4px);
    align-items: center; justify-content: center; padding: 20px;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: #fff; border-radius: 20px; max-width: 640px; width: 100%;
    max-height: 82vh; overflow: auto; padding: 24px;
    box-shadow: 0 24px 60px rgba(15,23,42,0.3);
  }
  .modal h2 { font-size: 20px; margin-bottom: 6px; background: linear-gradient(90deg, var(--grad-from), var(--grad-to)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .modal .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  pre.result {
    background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px;
    padding: 14px; font-size: 12.5px; line-height: 1.7; white-space: pre-wrap;
    word-break: break-all; color: var(--ink); max-height: 46vh; overflow: auto;
  }
  .modal .actions { display: flex; gap: 10px; margin-top: 16px; }
  .toast {
    position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(20px);
    background: rgba(15,23,42,0.88); color: #fff; font-size: 13px;
    padding: 10px 18px; border-radius: 999px; z-index: 60;
    opacity: 0; pointer-events: none; transition: all .25s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (max-width: 480px) { header h1 { font-size: 21px; } .q-title { font-size: 14px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🌸 伴柠番茄钟 · 内测反馈问卷</h1>
    <p>大约 3-4 分钟，没有标准答案。<br>你的真实感受，就是帮我们打磨 App 最宝贵的东西。</p>
    <div class="device">本机设备ID：<b id="deviceId">读取中…</b>（提交时随结果导出，用于和你的使用数据关联）</div>
  </header>

  <div class="progress-bar"><i id="progressFill"></i></div>
  <div id="questions"></div>

  <div class="toolbar">
    <div class="wrap">
      <button class="btn-ghost" onclick="clearAll()">清空重填</button>
      <button class="btn-primary" id="submitBtn" onclick="submit()">提交（0/15）</button>
    </div>
  </div>
</div>

<div class="modal-mask" id="modal">
  <div class="modal">
    <h2>🎉 提交成功，谢谢你！</h2>
    <div class="sub">你的回答已保存在本机。请复制下方内容，粘贴发给内测收集人；或在群里直接粘贴。</div>
    <pre class="result" id="resultText"></pre>
    <div class="actions">
      <button class="btn-ghost" onclick="closeModal()">关闭</button>
      <button class="btn-primary" onclick="copyResult()">复制结果</button>
      <button class="btn-primary" onclick="downloadResult()">下载 txt</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
'use strict';
const STORAGE_KEY = 'tamoto_survey_v1';

// ============ 问卷配置（改文案/加题只改这里） ============
const QUESTIONS = [
  { type: 'single', q: '你主要用伴柠番茄钟做什么？', section: '一、使用背景', opts: ['学习 / 备考', '工作', '健身 / 自律', '休闲 / 阅读', '其他 ____'] },
  { type: 'single', q: '你觉得 TA（AI 伙伴）的陪伴，对你“坚持专注”有实际帮助吗？', section: '二、整体感受', opts: ['帮助很大，没它我可能坚持不下来', '有一些帮助，是加分项', '帮助不大，番茄钟本身才是重点', '反而是负担 / 干扰', '说不好'] },
  { type: 'single', q: '专注时，你进入“完全沉浸 / 心流”状态的情况？', section: '三、沉浸与专注', opts: ['总是', '经常', '偶尔', '很少', '几乎没有'] },
  { type: 'single', q: '专注过程中，你刷手机 / 被手机分心的情况？', section: '三、沉浸与专注', opts: ['基本不看手机', '偶尔瞄一眼', '会刷一会儿', '经常走神看手机'] },
  { type: 'multi', q: '你中途放弃一个番茄钟，主要原因是什么？（可多选）', section: '三、沉浸与专注', opts: ['任务太难 / 做不下去', '25 分钟太长，坐不住', '有急事 / 临时要离开', '被 TA 的语音打扰', '一个人专注太无聊', '其他 ____'] },
  { type: 'single', q: '你希望 TA 主动说话的频率？', section: '四、关于 TA（最重要的一节）', opts: ['更频繁，陪伴感越强越好', '现在这个频率刚好', '再少一点', '最好别主动说', '完全静音（偶尔手动点 TA）'] },
  { type: 'multi', q: '哪些时机，TA 说话你觉得是加分、不打扰？（可多选）', section: '四、关于 TA（最重要的一节）', opts: ['专注刚开始时', '我分心 / 玩手机时提醒我', '我长时间专注后（比如 20 分钟）', '我休息 / 暂停时', '我从外面回来时', '无所谓，我自己想听时点 TA'] },
  { type: 'multi', q: '你最喜欢 TA 说什么类型的话？（可多选）', section: '四、关于 TA（最重要的一节）', opts: ['加油鼓励', '夸我“认真 / 坚持”', '提醒我别分心', '报进度（你已经专注 X 分钟了）', '闲聊日常', '剧情扮演 / 角色代入', '其他 ____'] },
  { type: 'multi', q: '你最喜欢 TA 用哪种语气？（可多选）', section: '四、关于 TA（最重要的一节）', opts: ['温柔 / 治愈', '活泼 / 元气', '严厉督促', '幽默 / 搞笑', '中二 / 中二病', '高冷 / 话少'] },
  { type: 'multi', q: '有没有过“TA 说话让我觉得被打扰 / 烦”的时刻？（可多选）', section: '四、关于 TA（最重要的一节）', opts: ['没有，都挺好', '专注刚开始（我还没进入状态）', '我正卡壳思考 / 解题时', '我已经在专注了还频繁说话', '内容重复 / 说来说去差不多', '内容尴尬 / 出戏', '其他 ____'] },
  { type: 'multi', q: '你更愿意用哪种方式和 TA 互动？（可多选）', section: '五、互动方式', opts: ['文字聊天', '按住说话（语音输入）', '点 TA 头像', '开摄像头让 TA“看见”我', '基本不互动，TA 看着就行'] },
  { type: 'single', q: '关于摄像头：你的情况是？', section: '五、互动方式', opts: ['开着，很喜欢', '想开，但担心隐私', '想开，但怕耗电 / 发热', '开了但觉得没用', '不知道有这功能', '环境不允许 / 不想被看见'] },
  { type: 'single', q: '关于语音输入（按住说话）：你的情况是？', section: '五、互动方式', opts: ['用过，体验不错', '用过，但识别不准 / 卡', '知道有，但没试过', '不喜欢 / 觉得麻烦', '不知道有这个功能'] },
  { type: 'single_reason', q: '你会继续用它作为你的专注工具吗？', section: '六、开放问题', opts: ['肯定会，已经离不开', '应该会，再看体验', '不好说', '大概不会'], reasonHint: '说说原因，比如最吸引你 / 最劝退你的点…' },
  { type: 'text', q: '最后，你还有什么想说的？', section: '六、开放问题', hint: '任何建议、遇到的 bug、吐槽、脑洞都可以。', required: false }
];

// ============ 渲染 ============
const root = document.getElementById('questions');
let lastSection = '';
QUESTIONS.forEach((item, idx) => {
  if (item.section && item.section !== lastSection) {
    root.insertAdjacentHTML('beforeend', `<div class="section-label">${item.section}</div>`);
    lastSection = item.section;
  }
  const num = idx + 1;
  const key = `q${num}`;
  let body = '';
  if (item.type === 'text') {
    body = `<textarea id="${key}" placeholder="${item.required === false ? '（选填）' : ''}${item.hint || '请填写'}" rows="${item.q.length > 30 ? 4 : 3}"></textarea>`;
    if (item.hint) body += `<div class="hint">${item.hint}</div>`;
  } else if (item.type === 'single' || item.type === 'multi' || item.type === 'single_reason') {
    const inputType = item.type === 'multi' ? 'checkbox' : 'radio';
    body = item.opts.map((opt, oi) => `
      <label class="opt">
        <input type="${inputType}" name="${key}" value="${opt.replace(/"/g,'&quot;')}" data-q="${key}" data-oi="${oi}">
        <span>${opt.replace(/____$/, '')}</span>
        ${/____$/.test(opt) ? '<input type="text" data-fill="' + key + '-' + oi + '" placeholder="请输入" style="margin-top:0">' : ''}
      </label>`).join('');
    if (item.type === 'single_reason') {
      body += `<div class="hint">为什么？请说说原因（选填）</div>`;
      body += `<textarea id="${key}-reason" placeholder="${item.reasonHint || '…'}" rows="2"></textarea>`;
    }
  }
  const requiredTag = item.required === false ? '' : '<span class="req">*</span>';
  root.insertAdjacentHTML('beforeend', `
    <div class="q-card" data-card="${key}">
      <div class="q-title"><span class="num">${num}</span>${item.q}${requiredTag}</div>
      ${body}
    </div>`);
});

// 其他____ 联动：选了带文本框的选项才显示输入框
document.addEventListener('input', e => {
  if (e.target.matches('input[type="radio"], input[type="checkbox"]')) {
    const key = e.target.dataset.q, oi = e.target.dataset.oi;
    const fill = document.querySelector(`input[data-fill="${key}-${oi}"]`);
    if (fill) fill.style.display = e.target.checked ? 'inline-block' : 'none';
    save();
  }
  if (e.target.matches('input[data-fill], textarea')) save();
});
// 点击整行切换
document.querySelectorAll('.opt').forEach(label => {
  label.addEventListener('click', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SPAN') return;
    const input = label.querySelector('input[type="radio"], input[type="checkbox"]');
    if (input) { input.checked = !input.checked; input.dispatchEvent(new Event('input')); }
  });
});

// ============ 存取 ============
function answerValue(input, key) {
  const base = input.value.replace(/ ____$/, '');
  const fill = document.querySelector(`input[data-fill="${key}-${input.dataset.oi}"]`);
  return (fill && fill.value.trim()) ? `${base}：${fill.value.trim()}` : base;
}
function save() {
  const data = {};
  QUESTIONS.forEach((item, idx) => {
    const key = `q${idx + 1}`;
    if (item.type === 'text') {
      const el = document.getElementById(key);
      data[key] = el ? el.value : '';
    } else if (item.type === 'single_reason') {
      const checked = [...document.querySelectorAll(`input[name="${key}"]:checked`)];
      const reasonEl = document.getElementById(`${key}-reason`);
      data[key] = {
        choice: checked.length ? answerValue(checked[0], key) : '',
        reason: reasonEl ? reasonEl.value : ''
      };
    } else {
      const checked = [...document.querySelectorAll(`input[name="${key}"]:checked`)].map(i => answerValue(i, key));
      data[key] = checked;
    }
  });
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  updateProgress();
}
function load() {
  let data; try { data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch { return; }
  QUESTIONS.forEach((item, idx) => {
    const key = `q${idx + 1}`, val = data[key];
    if (!val) return;
    if (item.type === 'text') { const el = document.getElementById(key); if (el) el.value = val; }
    else if (item.type === 'single_reason') {
      if (val.choice) {
        document.querySelectorAll(`input[name="${key}"]`).forEach(inp => {
          if (inp.value.replace(/ ____$/, '') === val.choice) inp.checked = true;
        });
      }
      if (val.reason) { const el = document.getElementById(`${key}-reason`); if (el) el.value = val.reason; }
    } else {
      const vals = Array.isArray(val) ? val : [val];
      document.querySelectorAll(`input[name="${key}"]`).forEach(inp => {
        const base = inp.value.replace(/ ____$/, '');
        const match = vals.find(v => v === inp.value || v === base || v.startsWith(base + '：'));
        if (match) {
          inp.checked = true;
          const fill = document.querySelector(`input[data-fill="${key}-${inp.dataset.oi}"]`);
          if (fill) {
            const custom = match.startsWith(base + '：') ? match.slice(base.length + 1) : '';
            if (custom) { fill.value = custom; fill.style.display = 'inline-block'; }
          }
        }
      });
    }
  });
  updateProgress();
}
function updateProgress() {
  const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  let answered = 0;
  QUESTIONS.forEach((item, idx) => {
    const v = data[`q${idx + 1}`];
    let filled = false;
    if (item.type === 'single_reason') filled = Boolean(v && (v.choice || v.reason));
    else if (v) filled = Array.isArray(v) ? v.length > 0 : String(v).trim() !== '';
    if (filled) answered++;
  });
  document.getElementById('progressFill').style.width = (answered / QUESTIONS.length * 100) + '%';
  document.getElementById('submitBtn').textContent = `提交（${answered}/${QUESTIONS.length}）`;
}

function clearAll() {
  if (!confirm('确定清空已填写的答案？')) return;
  localStorage.removeItem(STORAGE_KEY);
  location.reload();
}

// ============ 提交 ============
function validate() {
  const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  let firstMissing = null;
  QUESTIONS.forEach((item, idx) => {
    const key = `q${idx + 1}`;
    const v = data[key];
    let filled;
    if (item.type === 'text') {
      const el = document.getElementById(key);
      filled = Boolean(el && el.value.trim());
    } else if (item.type === 'single_reason') {
      filled = Boolean(v && v.choice);
    } else {
      filled = Array.isArray(v) && v.length > 0;
    }
    const card = document.querySelector(`[data-card="${key}"]`);
    if (!filled) {
      if (card) card.classList.add('missing');
      if (!firstMissing) firstMissing = card;
    } else if (card) card.classList.remove('missing');
  });
  return firstMissing;
}
function submit() {
  const missing = validate();
  if (missing) {
    toast('还有没答完的题，已帮你标红');
    missing.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  const lines = ['【伴柠番茄钟 · 内测反馈】', `提交时间：${new Date().toLocaleString()}`,
    `设备ID：${document.getElementById('deviceId').textContent}`, ''];
  QUESTIONS.forEach((item, idx) => {
    const key = `q${idx + 1}`, v = data[key];
    let val;
    if (item.type === 'text') val = v || '（未填）';
    else if (item.type === 'single_reason') {
      const obj = v || {};
      val = (obj.choice || '（未选）') + (obj.reason ? `；原因：${obj.reason}` : '');
    } else val = Array.isArray(v) && v.length ? v.join('、') : '（未选）';
    lines.push(`${idx + 1}. ${item.q.replace(/<[^>]*>/g, '')}\n   答：${val}`);
  });
  document.getElementById('resultText').textContent = lines.join('\n');
  document.getElementById('modal').classList.add('show');
  toast('已保存，记得复制结果发给收集人~');
}
function closeModal() { document.getElementById('modal').classList.remove('show'); }
function copyResult() {
  const text = document.getElementById('resultText').textContent;
  const done = () => toast('已复制到剪贴板');
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done, () => legacyCopy(text, done));
  } else legacyCopy(text, done);
}
function legacyCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch { toast('复制失败，请手动全选复制'); }
  document.body.removeChild(ta);
}
function downloadResult() {
  const blob = new Blob([document.getElementById('resultText').textContent], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `伴柠内测反馈_${new Date().toISOString().slice(0,10)}.txt`;
  a.click();
  URL.revokeObjectURL(a.href);
}
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

// ============ 设备 ID ============
(function initDeviceId() {
  const el = document.getElementById('deviceId');
  try {
    let id = localStorage.getItem('tamotoPushDeviceId');
    if (!id) { id = (crypto.randomUUID && crypto.randomUUID()) || '未生成'; }
    el.textContent = id;
  } catch { el.textContent = '不可用'; }
})();

load();
